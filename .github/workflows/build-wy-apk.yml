name: Build APK (self-signed)

# 专为 fork 设计：不依赖任何 Repository secrets。
# 上游 release.yml 需要 KEYSTORE_* 系列 secrets，fork 里没有，直接跑会失败。
# 这里用仓库自带的 android/app/debug.keystore 给 release 包签名，自用足够。
#
# 产物只保留 arm64-v8a 一个 APK（现代手机都是 arm64）。
# 通过 -PuniversalApk=false 关掉 universal 包，避免多出一个没用的 APK。

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - wy

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # 要往 Release 上传 APK 资产，需要写权限
    permissions:
      contents: write
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Ensure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # app/build.gradle 的 signingConfigs.release 在没有 -P 参数时会读 android/keystore.properties
      # 这里指向仓库内的 debug.keystore，从而让 assembleRelease 在没有 secrets 的情况下也能签名
      - name: Prepare signing config
        run: |
          cat > android/keystore.properties <<'EOF'
          storeFile=debug.keystore
          storePassword=android
          keyAlias=androiddebugkey
          keyPassword=android
          EOF
          echo "keystore.properties written"

      # 版本号：每次构建自动递增（只改 CI 工作区的 package.json，不回写仓库）
      # 版本串用纯数字第四段（1.9.2.415），App 内 compareVer 能正确比较；
      # 千万别用 -wy.415 这种字母后缀，compareVer 会把字母当负数，误判成旧版
      - name: Bump build version
        id: ver
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const run = Number(process.env.GITHUB_RUN_NUMBER || 0);
            const base = String(p.version).split('.').slice(0, 3).join('.');
            const baseCode = Number(p.versionCode || 78);
            p.version = base + '.' + run;
            p.versionCode = baseCode + run;
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'BUILD_VERSION=' + p.version + '\n');
            fs.appendFileSync(process.env.GITHUB_ENV, 'BUILD_VERSION_CODE=' + p.versionCode + '\n');
            console.log('build version:', p.version, '| versionCode:', p.versionCode);
          "

      - name: Build release
        id: rel
        continue-on-error: true
        env:
          DISABLE_SVG: 1
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=arm64-v8a \
            -PuniversalApk=false \
            -x lint -x lintVitalRelease \
            --stacktrace --no-daemon

      # release 挂了也要给出一个能装的包，否则只能看日志干瞪眼
      - name: Build debug (fallback)
        if: steps.rel.outcome == 'failure'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug \
            -PreactNativeArchitectures=arm64-v8a \
            -PuniversalApk=false \
            -x lint --stacktrace --no-daemon

      # 双保险：万一哪天 universal 又冒出来，这里直接删掉，只留 arm64-v8a
      - name: Keep only arm64-v8a APK
        if: always()
        run: |
          find android/app/build/outputs/apk -name '*universal*.apk' -delete 2>/dev/null || true
          echo "--- release ---"
          ls -lh android/app/build/outputs/apk/release/ 2>/dev/null || echo "(none)"
          echo "--- debug ---"
          ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "(none)"

      # 不要 upload-artifact：GitHub 的 artifact 下载永远是 zip，老板要的是直接下 apk。
      # 产物只走 Release 资产（下方 Publish APK to Release，直接传 apk 文件）。

      # GitHub Actions 的 artifact 永远是 zip，想要「点一下就下 apk」只能走 Release 资产。
      # 这里固定用 wy-latest 这个 tag，每次构建覆盖同名资产，链接永久不变。
      - name: Publish APK to Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls android/app/build/outputs/apk/release/*arm64-v8a.apk 2>/dev/null | head -1)
          [ -n "$APK" ] || APK=$(ls android/app/build/outputs/apk/debug/*arm64-v8a.apk 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "::error::没找到 APK，跳过 Release 上传"
            exit 0
          fi
          echo "built: $APK"
          VERSION=$(node -p "require('./package.json').version")
          # 上传用固定文件名：版本号在 APK 内部（versionName/versionCode），
          # 下载链接永远不变，不用每次换链接
          OUT="lx-music-mobile-arm64-v8a.apk"
          cp "$APK" "$OUT"
          echo "upload as: $OUT (version $VERSION)"
          TAG="wy-latest"
          NOTES=$(printf '%s\n' \
            "**本版本**：\`$VERSION\`（versionCode 见 Android 应用设置）" \
            "" \
            "每次 push 到 master 自动更新，文件名固定、链接永久有效。" \
            "" \
            "## 下载" \
            "" \
            "点下方 **Assets** 里的 \`$OUT\` —— 就是安装包本身，不是 zip。" \
            "" \
            "- 适用：Android arm64 手机（近几年机型都是）" \
            "- 安装：直接覆盖安装，登录状态和歌单都保留" \
            "" \
            "> Actions 页面的 artifact 已关闭（那个格式只能是 zip），安装包只在 Release 提供。")
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" \
              --title "WY 自动构建（arm64-v8a）" \
              --notes "$NOTES" \
              --latest=true
          else
            gh release edit "$TAG" --notes "$NOTES" --latest=true
          fi
          # 只保留当前这一个 apk，避免旧文件名残留
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | while read -r n; do
            case "$n" in *.apk) [ "$n" = "$OUT" ] || gh release delete-asset "$TAG" "$n" -y || true ;; esac
          done
          gh release upload "$TAG" "$OUT" --clobber
          echo "下载地址: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${OUT}"

      - name: Fail if release build failed
        if: steps.rel.outcome == 'failure'
        run: |
          echo "::error::release 构建失败，已回退到 debug 包，请查看上方 gradle 日志"
          exit 1
